name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dua job paralel: frontend-gate (build + unit test frontend + gitleaks) dan
  # backend-gate (suite database/backend/QA). Pisah SINYAL, bukan lemahkan gate —
  # merge butuh KEDUA job hijau, setiap lapis tetap blocking. Mencegah build
  # frontend + test frontend tersembunyi di belakang perf test database
  # (sebelumnya satu job sekuensial fail-fast). Keputusan tech-lead.
  frontend-gate:
    name: Frontend gate (format → lint → typecheck → build → unit → secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history untuk secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (versi dari packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Urutan gate sesuai CODE_STANDARDS.md §0 — merah di lapis mana pun = merge diblokir.
      - name: Format check
        run: pnpm format:check

      # Lint: semua path KECUALI area backend (backend punya lint-nya di backend-gate).
      # Partisi terverifikasi: job ini 33 file, backend-gate 93 file, total 126 = eslint .
      - name: Lint (frontend + root)
        run: >-
          pnpm exec eslint . --max-warnings=0
          --ignore-pattern "backend/**"
          --ignore-pattern "database/**"
          --ignore-pattern "test/**"
          --ignore-pattern "src/pages/api/**"

      # Typecheck project-wide by nature (satu tsconfig) — type error di mana pun
      # gagalkan job ini; build butuh types OK (next build juga type-check).
      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Unit test frontend (src/lib) — job ini self-contained untuk perubahan
      # frontend. Duplikasi dengan backend-gate (pnpm test menjalankan suite
      # penuh) diterima: kebersihan sinyal lebih murah daripada beberapa detik.
      - name: Test (frontend unit)
        run: pnpm exec vitest run src/lib

      # Secret scan (SPEC §11) — blocking, repo-wide, sekali saja (di job ini).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-gate:
    name: Backend gate (format → lint → typecheck → test → perf native PG)
    runs-on: ubuntu-latest
    # Service container Postgres native (SPEC §4.2): perf test diukur di
    # lingkungan production-like, bukan PGlite/WASM di runner bersama.
    # Keputusan tech-lead — perbaikan LINGKUNGAN PENGUKURAN, bukan ambang
    # (300 ms tetap). Suite lain tetap PGlite (cepat, isolasi per file).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lakoo
          POSTGRES_PASSWORD: lakoo
          POSTGRES_DB: lakoo_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (versi dari packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Lint: hanya area backend (database/, backend/, test/, mount API).
      - name: Lint (backend)
        run: pnpm exec eslint database/ backend/ test/ src/pages/api --max-warnings=0

      - name: Type check
        run: pnpm typecheck

      # Suite database + backend + QA di PGlite (cepat, isolasi per file).
      # Perf test TIDAK jalan di sini — punya step sendiri di Postgres native,
      # supaya sinyal suite tidak dikontaminasi pengukuran dan sebaliknya.
      - name: Test (suite, PGlite)
        run: pnpm exec vitest run --exclude '**/productStats.test.ts'

      # Perf test (SPEC §4.2 ≤ 300 ms) terhadap service container Postgres
      # native: schema dari file migrasi yang SAMA dengan produksi (helper
      # native-pg), seed deterministik (generateDemo + seedDemoTemplate).
      # Threshold TIDAK berubah — yang berubah lingkungan ukurnya. Butuh
      # harness native-pg + PERF_DATABASE_URL switch (backend-dev/QA); kalau
      # koneksi gagal helper melempar error, TIDAK fallback ke PGlite.
      - name: Perf test (Postgres native)
        run: pnpm exec vitest run database/src/queries/productStats.test.ts
        env:
          PERF_DATABASE_URL: postgresql://lakoo:lakoo@localhost:5432/lakoo_perf
