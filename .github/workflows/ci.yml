name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (format → lint → typecheck → test → build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history untuk secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (versi dari packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Urutan gate sesuai CODE_STANDARDS.md §0 — merah di lapis mana pun = merge diblokir.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Secret scan (SPEC §11) — blocking.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
